name: Build Proton

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Build name (shown in Steam, used for the archive name)
        required: true
        default: proton-rtsp
      mf_diagnostics:
        description: Include the WINE_MFME_PROFILE / WINE_MFRW_PROFILE diagnostics
        type: boolean
        default: false
      runner:
        description: >-
          Runner label. Hosted runners are tight on disk space and time for a
          full Proton build; use a self-hosted label for reliable builds.
        default: ubuntu-24.04
      release:
        description: Publish the archive as a GitHub release (draft)
        type: boolean
        default: false
  push:
    tags:
      - 'rtsp-*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      BUILD_NAME: ${{ inputs.build_name || github.ref_name }}
      MF_DIAGNOSTICS: ${{ inputs.mf_diagnostics && '1' || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ env.MF_DIAGNOSTICS }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ env.MF_DIAGNOSTICS }}-
            ccache-

      - name: Configure
        run: |
          mkdir -p build "$CCACHE_DIR"
          cd build
          flags=""
          if [ "$MF_DIAGNOSTICS" = "1" ]; then flags="--enable-mf-diagnostics"; fi
          ../configure.sh --build-name="$BUILD_NAME" --enable-ccache --container-engine=docker $flags

      - name: Build
        working-directory: build
        run: make -j"$(nproc)" redist

      - name: Package
        run: |
          mkdir -p out
          cp -a build/redist "out/$BUILD_NAME"
          tar -C out -czf "$BUILD_NAME.tar.gz" "$BUILD_NAME"
          sha512sum "$BUILD_NAME.tar.gz" > "$BUILD_NAME.sha512sum"
          ls -lh "$BUILD_NAME".*

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: |
            ${{ env.BUILD_NAME }}.tar.gz
            ${{ env.BUILD_NAME }}.sha512sum
          compression-level: 0

      - name: Create release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="$BUILD_NAME"; fi
          gh release create "$tag" --draft --title "$BUILD_NAME" --target "$GITHUB_SHA" \
            "$BUILD_NAME.tar.gz" "$BUILD_NAME.sha512sum"
